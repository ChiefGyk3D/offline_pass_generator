# CodeQL, gitleaks, dependency review on pull requests and Semgrep.
# The jobs live in ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@9e0d7b2e7e8530e2b1bb200ecb4fbf6de021881f # v1.38.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-queries: security-extended,security-and-quality
      # No requirements file to audit (dependencies are in pyproject.toml or absent).
      pip-audit-requirements: ""
      egress-policy: block
